<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ClearPoint Global CRM</title>
<style>
  :root{--rail:#0f1f3d;--ink:#e9e4d6}
  html,body{height:100%;margin:0}
  body{background:var(--rail);color:var(--ink);font:15px/1.6 "Helvetica Neue",Arial,sans-serif;display:grid;place-items:center;text-align:center}
  .crest{width:64px;height:64px;margin:0 auto 18px;display:grid;place-items:center;border:1px solid var(--ink);box-shadow:inset 0 0 0 4px var(--rail),inset 0 0 0 5px var(--ink);font:600 24px Georgia,serif}
  h1{font:600 30px Georgia,serif;margin:0 0 8px}
  p{opacity:.8;max-width:34ch;margin:0 auto 20px}
  button{background:var(--ink);color:var(--rail);border:0;border-radius:3px;padding:12px 22px;font:600 12px Arial;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
</style>
</head>
<body>
  <div>
    <div class="crest">CP</div>
    <h1>You're offline</h1>
    <p>The CRM needs an internet connection. Check your Wi-Fi, then try again.</p>
    <button type="button" onclick="location.href = new URLSearchParams(location.search).get('u')">Try again</button>
  </div>
</body>
</html>
