<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClearPoint Global CRM</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co;">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<style>
/* Layout idea: a recruiter's cockpit. Slim nav rail on the left, one live view at a time,
   a profile drawer that slides over from the right. Indigo for action, orange for "hot". */
/* Layout idea: a private-bank ledger. A navy rail with an ivory monogram, ivory paper, ink-black type,
   hairline rules, serif numerals. Navy for action, black for authority, white space for calm. */
:root{
  --bg:#f6f4ee; --surface:#fffefa; --surface-2:#f0ede4; --ink:#0c0f16; --ink-2:#3a4150; --ink-3:#7b808c;
  --line:#e3ded1; --line-2:#c9c2af;
  --accent:#14284b; --accent-ink:#fbf9f3; --accent-soft:#e7ebf3; --hot:#8c2131;
  --good:#2f6a4e; --warn:#94742a; --bad:#8f2430;
  --rookie:#4d78a8; --exp:#14284b; --lead:#0c0f16;
  --rail:#0f1f3d; --rail-ink:#e9e4d6; --rail-dim:#9aa6bd;
  --shadow:0 1px 0 rgba(12,15,22,.04),0 10px 30px -18px rgba(15,31,61,.25);
  --shadow-lift:0 24px 48px -20px rgba(15,31,61,.35);
  --display:"Cormorant Garamond", "Iowan Old Style", Garamond, "Times New Roman", serif;
  --body:"Libre Franklin", "Helvetica Neue", Arial, system-ui, sans-serif;
  --r:6px; --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.4,.64,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:500 14px/1.5 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:232px 1fr;height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:18px 12px;position:sticky;top:0;height:100vh;height:100dvh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.mark{width:34px;height:34px;border-radius:10px;background:conic-gradient(from 210deg,var(--accent),var(--lead),var(--hot),var(--accent));display:grid;place-items:center;color:#fff;font:800 15px var(--display);box-shadow:0 6px 16px rgba(72,70,245,.35);animation:spin 14s linear infinite}
.mark span{animation:spin 14s linear infinite reverse;display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.brand b{font:700 16px/1.1 var(--display)} .brand small{display:block;color:var(--ink-3);font-size:11.5px;font-weight:600}
.nav{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;color:var(--ink-2);font-weight:600;position:relative;transition:background .2s,color .2s}
.nav svg{width:18px;height:18px;flex:none}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--accent);animation:grow .35s var(--spring)}
@keyframes grow{from{transform:scaleY(0)}}
.nav .badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--hot);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.nav .badge:empty{display:none}
.rail .grow{flex:1}
.credits{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--ink-2)}
.credits b{font:700 18px var(--display);color:var(--ink)}
.meter{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--lead));border-radius:6px;transition:width 1.2s var(--ease)}
.save{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3);padding:6px 8px}
.save i{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.save[data-s="saved"] i{background:var(--good)} .save[data-s="saving"] i{background:var(--warn);animation:pulse 1s infinite}
.save[data-s="error"] i,.save[data-s="offline"] i{background:var(--bad)}
@keyframes pulse{50%{opacity:.3}}

.main{min-width:0;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:auto}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:14px 28px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid transparent}
.main.scrolled .top{border-bottom-color:var(--line)}
.top h1{font-size:24px;font-weight:800;margin-right:auto}
.search{position:relative;width:min(380px,40vw)}
.search input{width:100%;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 40px 0 38px;transition:border-color .2s,box-shadow .2s}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.search svg{position:absolute;left:12px;top:11px;width:18px;height:18px;color:var(--ink-3)}
.search kbd{position:absolute;right:10px;top:10px;font:600 11px var(--body);color:var(--ink-3);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.content{padding:8px 28px 48px;display:flex;flex-direction:column;gap:20px}
.banner{border:1px solid var(--line);background:var(--surface);border-left:4px solid var(--warn);border-radius:12px;padding:10px 14px;font-size:13.5px}
.banner[hidden]{display:none}

/* ---------- buttons, fields, chips ---------- */
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 15px;border-radius:11px;border:1px solid var(--line-2);background:var(--surface);font-weight:700;font-size:13.5px;position:relative;overflow:hidden;transition:transform .15s var(--ease),box-shadow .2s,background .2s,border-color .2s;white-space:nowrap}
.btn:hover{border-color:var(--ink-3);box-shadow:var(--shadow)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 40%,transparent)}
.btn.glow{background:linear-gradient(120deg,var(--accent),var(--lead));border:0;color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{height:32px;padding:0 11px;font-size:12.5px;border-radius:9px}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn svg{width:16px;height:16px}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.25;transform:scale(0);animation:rip .6s var(--ease) forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.field{height:38px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 11px;min-width:0;transition:border-color .2s,box-shadow .2s}
textarea.field{height:auto;padding:10px 11px;resize:vertical;line-height:1.55}
.field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
label.lbl{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--ink-2)}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.rookie{background:color-mix(in srgb,var(--rookie) 14%,transparent);color:var(--rookie)}
.chip.experienced{background:color-mix(in srgb,var(--exp) 14%,transparent);color:var(--exp)}
.chip.leader{background:color-mix(in srgb,var(--lead) 15%,transparent);color:var(--lead)}
.chip.hot{background:color-mix(in srgb,var(--hot) 16%,transparent);color:var(--hot)}
.chip.ap{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{all:unset;cursor:pointer;height:32px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;transition:all .2s var(--ease)}
.pill:hover{border-color:var(--line-2)}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pill .n{opacity:.6;font-variant-numeric:tabular-nums}
.note{font-size:12.5px;color:var(--ink-3)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card > .hd{display:flex;align-items:center;gap:10px;padding:16px 18px 0}
.card > .hd h2{font-size:16px;font-weight:700;margin-right:auto}
.card > .bd{padding:14px 18px 18px}

/* ---------- motion ---------- */
.view{display:flex;flex-direction:column;gap:20px;animation:viewIn .45s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}}
.stagger > *{animation:rise .5s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.985)}}

/* ---------- dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpi{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden;box-shadow:var(--shadow);transition:transform .25s var(--ease),box-shadow .25s}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift)}
.kpi::after{content:"";position:absolute;inset:auto -30% -60% auto;width:120px;height:120px;border-radius:50%;background:var(--c,var(--accent));opacity:.08;transition:transform .5s var(--ease)}
.kpi:hover::after{transform:scale(1.5)}
.kpi .k{font-size:12px;font-weight:700;color:var(--ink-2)}
.kpi .v{font:800 30px/1.1 var(--display);font-variant-numeric:tabular-nums;color:var(--ink)}
.kpi .s{font-size:11.5px;color:var(--ink-3)}
.kpi .bar{height:4px;border-radius:4px;background:var(--c,var(--accent));width:0;transition:width 1.1s var(--ease);margin-top:6px}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:20px}
.funnel{display:flex;flex-direction:column;gap:10px}
.frow{display:grid;grid-template-columns:110px 1fr 70px;align-items:center;gap:12px;font-size:13px;font-weight:600}
.ftrack{height:26px;border-radius:8px;background:var(--surface-2);overflow:hidden}
.ftrack i{display:block;height:100%;border-radius:8px;width:0;transition:width 1.2s var(--ease);background:var(--c)}
.frow .num{text-align:right;color:var(--ink-2)}
.states{display:flex;flex-direction:column;gap:9px}
.srow{all:unset;cursor:pointer;display:grid;grid-template-columns:34px 1fr 96px;gap:10px;align-items:center;font-size:12.5px;padding:2px 4px;border-radius:8px;transition:background .2s}
.srow:hover{background:var(--surface-2)}
.srow b{font-weight:800}
.strack{height:12px;border-radius:6px;background:var(--surface-2);position:relative;overflow:hidden}
.strack i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;width:0;transition:width 1.1s var(--ease)}
.strack i.a{background:color-mix(in srgb,var(--accent) 30%,transparent)} .strack i.b{background:var(--accent)}
.srow .num{color:var(--ink-2);text-align:right}
.feed{display:flex;flex-direction:column}
.fitem{all:unset;cursor:pointer;display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:9px 6px;border-radius:10px;transition:background .2s}
.fitem:hover{background:var(--surface-2)}
.fitem .t{font-weight:700} .fitem .d{font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#fff;font:700 13px var(--display);flex:none}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.empty{padding:26px;text-align:center;color:var(--ink-3);font-size:13px}

/* ---------- prospects table ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar .field{height:36px}
.tablewrap{overflow:auto;border-radius:var(--r)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th button{all:unset;cursor:pointer} th button:hover{color:var(--ink)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer;transition:background .15s}
tbody tr:hover{background:var(--surface-2)}
tbody tr.sel{background:var(--accent-soft)}
tbody tr.open{box-shadow:inset 3px 0 0 var(--accent)}
.who{display:flex;gap:11px;align-items:center;min-width:220px}
.who .nm{font-weight:700} .who .sub{font-size:12px;color:var(--ink-3)}
.score{display:inline-flex;align-items:center;gap:8px;font-weight:800}
.score .sb{width:46px;height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.score .sb i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--lead));border-radius:6px}
.stat{display:inline-flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap}
.cicons{display:flex;gap:4px}
.cicons i{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-3)}
.cicons i.on{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.cicons svg{width:13px;height:13px}
.pager{display:flex;align-items:center;gap:10px;justify-content:flex-end;padding:12px 16px}
.bulk{position:fixed;left:50%;bottom:22px;transform:translate(-50%,140%);opacity:0;visibility:hidden;z-index:30;background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 12px 10px 18px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-lift);transition:transform .45s var(--spring),opacity .3s,visibility .3s}
.bulk.on{transform:translate(-50%,0);opacity:1;visibility:visible}
.bulk .btn{background:transparent;border-color:color-mix(in srgb,var(--bg) 30%,transparent);color:var(--bg)}
.bulk select{background:var(--ink);color:var(--bg);border-color:color-mix(in srgb,var(--bg) 30%,transparent)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}

/* ---------- board ---------- */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:14px;overflow-x:auto;padding-bottom:10px;min-height:60vh}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:0;transition:background .2s,border-color .2s}
.col.over{background:var(--accent-soft);border-color:var(--accent)}
.col .ch{display:flex;align-items:center;gap:8px;padding:13px 14px;font-weight:800;font-family:var(--display)}
.col .ch .n{margin-left:auto;font:700 12px var(--body);color:var(--ink-3)}
.col .cards{display:flex;flex-direction:column;gap:9px;padding:0 10px 12px;overflow:auto;max-height:68vh}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:grab;display:flex;flex-direction:column;gap:7px;box-shadow:var(--shadow);transition:transform .2s var(--ease),box-shadow .2s,opacity .2s;animation:rise .4s var(--ease) both}
.kcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.kcard.drag{opacity:.4;transform:rotate(2deg) scale(.98)}
.kcard .r1{display:flex;align-items:center;gap:8px}
.kcard .r1 b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kcard .r2{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink-3)}
.col .more{font-size:12px;color:var(--ink-3);text-align:center;padding:4px}
.land{animation:land .5s var(--spring)}
@keyframes land{0%{transform:scale(.9)}100%{transform:scale(1)}}

/* ---------- inbox ---------- */
.inbox{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.msg{all:unset;cursor:pointer;display:grid;grid-template-columns:36px 1fr auto;gap:12px;padding:12px;border-radius:12px;border:1px solid transparent;transition:all .2s}
.msg:hover{background:var(--surface-2);border-color:var(--line)}
.msg .t{font-weight:700} .msg .q{font-size:12.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.msg .w{font-size:11.5px;color:var(--ink-3);white-space:nowrap}

/* ---------- apollo ---------- */
.finder{display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:start}
.form{display:flex;flex-direction:column;gap:12px}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.result{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);animation:rise .4s var(--ease) both}
.result:last-child{border-bottom:0}
.result .t{font-weight:700} .result .d{font-size:12.5px;color:var(--ink-3)}
.shimmer{height:56px;border-radius:12px;background:linear-gradient(90deg,var(--surface-2) 0%,var(--line) 40%,var(--surface-2) 80%);background-size:200% 100%;animation:sh 1.2s linear infinite;margin-bottom:8px}
@keyframes sh{to{background-position:-200% 0}}
.err{border:1px solid color-mix(in srgb,var(--bad) 40%,transparent);background:color-mix(in srgb,var(--bad) 8%,transparent);border-radius:12px;padding:12px 14px;font-size:13px}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,11,25,.35);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--bg);z-index:41;transform:translateX(105%);transition:transform .5s var(--ease);display:flex;flex-direction:column;box-shadow:var(--shadow-lift)}
.drawer.on{transform:none}
.dhead{padding:20px 22px 0;display:flex;flex-direction:column;gap:14px;background:var(--surface);border-bottom:1px solid var(--line)}
.dtop{display:flex;align-items:center;gap:8px}
.dtop .sp{flex:1}
.hero{display:flex;gap:16px;align-items:center}
.hero .avatar{width:58px;height:58px;border-radius:17px;font-size:21px}
.hero h2{font-size:23px;font-weight:800}
.hero .sub{color:var(--ink-2);font-size:13px}
.ring{width:62px;height:62px;margin-left:auto;position:relative;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .bgc{stroke:var(--surface-2)} .ring .fg{stroke:url(#rg);stroke-linecap:round;transition:stroke-dashoffset 1.2s var(--ease)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:800 17px var(--display)}
.tabs{display:flex;gap:4px;position:relative}
.tab{all:unset;cursor:pointer;padding:10px 14px;font-weight:700;color:var(--ink-3);transition:color .2s}
.tab[aria-selected="true"]{color:var(--ink)}
.tabs .ink{position:absolute;bottom:-1px;height:3px;border-radius:3px;background:var(--accent);transition:left .35s var(--ease),width .35s var(--ease)}
.dbody{flex:1;overflow:auto;padding:20px 22px 40px;display:flex;flex-direction:column;gap:16px}
.dbody > *{flex:none}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv .lbl input{width:100%}
.apcard{border-radius:var(--r);padding:16px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 10%,var(--surface)),var(--surface) 60%);border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.apcard h3{font-size:15px;display:flex;align-items:center;gap:8px}
.apcard .scan{position:absolute;left:0;right:0;top:0;height:100%;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--accent) 18%,transparent),transparent);transform:translateY(-100%);animation:scan 1.4s var(--ease) infinite}

/* ---------- scripts & settings ---------- */

/* ---------- toast, modal, confetti ---------- */
.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-160%);opacity:0;visibility:hidden;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:700;z-index:60;box-shadow:var(--shadow-lift);transition:transform .45s var(--spring),opacity .3s,visibility .3s;max-width:min(560px,92vw)}

.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:55;background:rgba(10,11,25,.4);opacity:0;pointer-events:none;transition:opacity .25s;padding:16px}

  .brand,.credits,.save,.rail .grow{display:none}

}

/* =================== flagship polish =================== */
.rail{background:linear-gradient(180deg,#132a52 0%,var(--rail) 38%,#0a1630 100%);box-shadow:inset -1px 0 0 color-mix(in srgb,var(--rail-ink) 10%,transparent)}
.nav{transition:background .25s,color .25s,transform .25s var(--ease)}
.nav:hover{transform:translateX(2px)}
.nav[aria-current="page"]{background:linear-gradient(90deg,color-mix(in srgb,var(--rail-ink) 16%,transparent),color-mix(in srgb,var(--rail-ink) 4%,transparent));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--rail-ink) 10%,transparent)}
.mark{position:relative;overflow:hidden}
.mark::after{content:"";position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);transform:translateX(-120%);animation:sheen 6s var(--ease) infinite 1.5s}
@keyframes sheen{0%{transform:translateX(-120%)}18%,100%{transform:translateX(120%)}}
/* hero greeting */
.hero-band{position:relative;overflow:hidden;border-radius:var(--r);padding:28px 30px;color:#f3efe4;background:
  radial-gradient(ellipse at 85% -20%,rgba(169,191,227,.35),transparent 55%),
  radial-gradient(ellipse at 0% 120%,rgba(255,255,255,.08),transparent 50%),
  linear-gradient(135deg,#0f1f3d 0%,#16305c 55%,#0b1730 100%);
  box-shadow:0 30px 60px -30px rgba(15,31,61,.6),inset 0 0 0 1px rgba(255,255,255,.06);display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.hero-band::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 7px);pointer-events:none}
.hero-band::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.07),transparent);animation:sweep 7s var(--ease) infinite 1s;pointer-events:none}
@keyframes sweep{0%{left:-40%}25%,100%{left:120%}}
.hero-band > *{position:relative;z-index:1}
.hero-band h2{font-size:38px;color:#fbf8f0;font-weight:600}
.hero-band .eyebrow{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:#a9bfe3;margin-bottom:8px}

/* KPI sheen + glow */
.kpi{transition:transform .35s var(--ease),box-shadow .35s}
.kpi:hover{transform:translateY(-4px);box-shadow:0 26px 50px -24px rgba(15,31,61,.45)}
.kpi .sheen{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-110%);pointer-events:none;mix-blend-mode:soft-light}
.kpi:hover .sheen{animation:kpisheen .9s var(--ease)}

.btn.primary:hover::after,.btn.glow:hover::after{transform:translateX(120%)}
tbody tr{transition:background .2s,transform .2s}
tbody tr:hover{background:linear-gradient(90deg,var(--accent-soft),transparent 70%)}
.toast{display:flex;align-items:center;gap:10px}
.toast::before{content:"";width:8px;height:8px;border-radius:50%;background:#a9bfe3;box-shadow:0 0 0 4px rgba(169,191,227,.25);flex:none}
/* getting-started checklist */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stp{all:unset;cursor:pointer;display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:4px;background:var(--surface);transition:border-color .25s,transform .25s var(--ease),box-shadow .25s}
.stp:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}

.progress{height:3px;background:var(--surface-2);margin-top:12px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#6d93c4);transition:width 1.2s var(--ease)}
/* skeleton while loading */
.skel{height:110px;border-radius:var(--r);background:linear-gradient(90deg,var(--surface-2) 0%,var(--surface) 40%,var(--surface-2) 80%);background-size:200% 100%;animation:sh 1.3s linear infinite}
/* login */
.gate{background:linear-gradient(135deg,#0b1730,#16305c 50%,#0b1730);background-size:200% 200%;animation:gatebg 14s ease infinite}
@keyframes gatebg{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.gbox{animation:rise .7s var(--ease)}
@media (max-width:1100px){ .steps{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:760px){ .steps{grid-template-columns:1fr} .hero-band h2{font-size:28px} }

/* home: three big actions */
.bigacts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}

/* work: three tabs */
.worktabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}

.qitem{padding:11px 12px}

/* leads */

/* ---------- dashboard greeting, pipeline summary, territories ---------- */

<script id="core">
/* ===================== core logic (no DOM) ===================== */
var Core = (function(){
  var STATES = {AL:"Alabama",AK:"Alaska",AZ:"Arizona",AR:"Arkansas",CA:"California",CO:"Colorado",CT:"Connecticut",DE:"Delaware",DC:"District of Columbia",FL:"Florida",GA:"Georgia",HI:"Hawaii",ID:"Idaho",IL:"Illinois",IN:"Indiana",IA:"Iowa",KS:"Kansas",KY:"Kentucky",LA:"Louisiana",ME:"Maine",MD:"Maryland",MA:"Massachusetts",MI:"Michigan",MN:"Minnesota",MS:"Mississippi",MO:"Missouri",MT:"Montana",NE:"Nebraska",NV:"Nevada",NH:"New Hampshire",NJ:"New Jersey",NM:"New Mexico",NY:"New York",NC:"North Carolina",ND:"North Dakota",OH:"Ohio",OK:"Oklahoma",OR:"Oregon",PA:"Pennsylvania",RI:"Rhode Island",SC:"South Carolina",SD:"South Dakota",TN:"Tennessee",TX:"Texas",UT:"Utah",VT:"Vermont",VA:"Virginia",WA:"Washington",WV:"West Virginia",WI:"Wisconsin",WY:"Wyoming",PR:"Puerto Rico"};
  var BYNAME = {}; Object.keys(STATES).forEach(function(k){ BYNAME[STATES[k].toLowerCase()] = k; });

  var TARGETS = [
    {k:"first",label:"First name",syn:["first name","firstname","first","given name","fname"]},
    {k:"last",label:"Last name",syn:["last name","lastname","last","surname","lname","family name"]},
    {k:"full",label:"Full name",syn:["name","full name","licensee name","agent name","individual name","producer name","contact name","licensee"]},
    {k:"email",label:"Email",syn:["email","e mail","email address","work email","business email","primary email","email 1"]},
    {k:"phone",label:"Business phone",syn:["work direct phone","corporate phone","business phone","office phone","work phone","phone","phone number","first phone","telephone","business phone number","primary phone"]},
    {k:"mobile",label:"Mobile phone",syn:["mobile phone","mobile","cell phone","cell","mobile number"]},
    {k:"company",label:"Company / agency",syn:["company","company name","agency","agency name","organization","employer","business name","account name","firm","org name","organization name"]},
    {k:"title",label:"Job title",syn:["title","job title","position","headline","role"]},
    {k:"seniority",label:"Seniority",syn:["seniority","level"]},
    {k:"city",label:"City",syn:["city","business city","mailing city"]},
    {k:"state",label:"State",syn:["state","business state","state code","st","mailing state"]},
    {k:"zip",label:"ZIP",syn:["postal code","zip","zip code","business zip","zipcode","pstl cd"]},
    {k:"lic",label:"License issue date",syn:["issue date","license issue date","original issue date","orig issue date","first active date","license date","issued","date issued","effective date","first licensed"]},
    {k:"exp",label:"License expiration",syn:["expiration date","expiration","exp date","expires","license expiration date"]},
    {k:"npn",label:"NPN",syn:["npn","npn number","national producer number","producer number"]},
    {k:"lines",label:"Lines of authority",syn:["qualification","lines of authority","line of authority","loa","qualifications","license tycl desc","license type","lines"]},
    {k:"linkedin",label:"LinkedIn URL",syn:["person linkedin url","linkedin url","linkedin","linkedin profile"]},
    {k:"keywords",label:"Keywords / bio",syn:["keywords","bio","summary","about","description"]}
  ];
  var LOOSE = {email:1,phone:1,mobile:1,lic:1,npn:1,linkedin:1,lines:1};
  var LOOSE_BAD = /status|confidence|source|home|secondary|other|verified|catch|owner|count|type of|last contacted/;

  function normHeader(h){ return String(h||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim(); }

  function autoMap(headers){
    var map = {}, used = {}, norm = headers.map(normHeader);
    TARGETS.forEach(function(t){
      for (var i=0;i<t.syn.length;i++){
        var j = norm.indexOf(t.syn[i]);
        if (j>-1 && !used[j]){ map[t.k] = headers[j]; used[j]=1; return; }
      }
    });
    TARGETS.forEach(function(t){
      if (map[t.k] || !LOOSE[t.k]) return;
      for (var i=0;i<t.syn.length;i++){
        if (t.syn[i].length<4) continue;
        for (var j=0;j<norm.length;j++){
          if (used[j] || LOOSE_BAD.test(norm[j])) continue;
          if ((" "+norm[j]+" ").indexOf(" "+t.syn[i]+" ")>-1){ map[t.k]=headers[j]; used[j]=1; return; }
        }
      }
    });
    if (map.full && map.first && map.last) delete map.full;
    /* fallback columns: Apollo has several phone columns and many rows leave the first one empty */
    var alt = {phone:[], mobile:[]};
    ["phone","mobile"].forEach(function(k){
      var t = TARGETS.filter(function(x){ return x.k===k; })[0];
      t.syn.forEach(function(sy){ var j = norm.indexOf(sy); if (j>-1 && headers[j]!==map[k]) alt[k].push(headers[j]); });
    });
    Object.defineProperty(map, "_alt", {value:alt, enumerable:false});
    return map;
  }

  function pad(n){ return (n<10?"0":"")+n; }
  function parseDate(s){
    s = String(s==null?"":s).trim(); if (!s) return null;
    var m, y, mo, d;
    if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) { y=+m[1]; mo=+m[2]; d=+m[3]; }
    else if ((m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})\b/))) { mo=+m[1]; d=+m[2]; y=+m[3]; if (y<100) y += (y<50?2000:1900); }
    else if ((m = s.match(/^(\d{4})(\d{2})(\d{2})$/))) { y=+m[1]; mo=+m[2]; d=+m[3]; }
    else { var t = Date.parse(s); if (isNaN(t)) return null; var dt = new Date(t); y=dt.getFullYear(); mo=dt.getMonth()+1; d=dt.getDate(); }
    if (y<1900 || y>2100 || mo<1 || mo>12 || d<1 || d>31) return null;
    return y+"-"+pad(mo)+"-"+pad(d);
  }
  function dateMs(iso){ if(!iso) return NaN; var p = iso.split("-"); return Date.UTC(+p[0], +p[1]-1, +p[2]); }

  function titleCase(s){
    s = String(s||"").trim().replace(/\s+/g," ");
    if (!s) return "";
    if (s !== s.toUpperCase() && s !== s.toLowerCase()) return s;
    return s.toLowerCase().replace(/(^|[\s\-'’])([a-z])/g, function(a,b,c){ return b+c.toUpperCase(); })
            .replace(/\bMc([a-z])/g, function(a,c){ return "Mc"+c.toUpperCase(); })
            .replace(/\b(Ii|Iii|Iv|Llc|Pllc|Lc|Lp|Llp|Pc|Ii)\b/g, function(a){ return a.toUpperCase(); });
  }
  var SUFFIX = /^(jr|sr|ii|iii|iv|v|cpa|cfp|clu|chfc|mba)\.?$/i;
  function splitName(full){
    full = String(full||"").trim().replace(/\s+/g," ");
    if (!full) return {first:"",last:""};
    if (full.indexOf(",")>-1){
      var parts = full.split(","); var last = parts[0].trim();
      var rest = parts.slice(1).join(" ").trim().split(" ").filter(function(t){ return t && !SUFFIX.test(t); });
      return {first:titleCase(rest[0]||""), last:titleCase(last)};
    }
    var toks = full.split(" ").filter(function(t){ return !SUFFIX.test(t); });
    if (toks.length===1) return {first:titleCase(toks[0]), last:""};
    var rest = toks.slice(1).filter(function(t){ return t.replace(/\./g,"").length>1; });
    if (!rest.length) rest = [toks[toks.length-1]];
    return {first:titleCase(toks[0]), last:titleCase(rest.join(" "))};
  }
  function normPhone(s){
    s = String(s||"").trim(); if (!s) return "";
    s = s.replace(/^'+/, "");
    var d = s.replace(/\D/g,"");
    if (d.length===11 && d[0]==="1") d = d.slice(1);
    if (d.length===10) return "+1"+d;
    return d.length>=7 ? s : "";
  }
  function fmtPhone(p){ var m = String(p||"").match(/^\+1(\d{3})(\d{3})(\d{4})$/); return m ? "("+m[1]+") "+m[2]+"-"+m[3] : (p||""); }
  function normState(s){
    s = String(s||"").trim(); if (!s) return "";
    var up = s.toUpperCase(); if (STATES[up]) return up;
    var byn = BYNAME[s.toLowerCase()]; return byn || (s.length<=3 ? up : titleCase(s));
  }
  function cap(s,n){ s = String(s==null?"":s).trim(); return s.length>n ? s.slice(0,n) : s; }
  function normEmail(s){ s = String(s||"").trim().toLowerCase(); return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(s) ? s : ""; }

  function uid(){ if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){ var r = Math.random()*16|0; return (c==='x'?r:(r&3|8)).toString(16); }); }

  /* Build one record from a CSV row using the mapping; returns {rec, skip} */
  function buildRecord(row, map, opt, todayIso){
    function g(k){
      var v = map[k] ? String(row[map[k]]==null?"":row[map[k]]).trim().replace(/^="?|"$/g,"") : "";
      if (!v && map._alt && map._alt[k]) for (var i=0;i<map._alt[k].length && !v;i++) v = String(row[map._alt[k][i]]==null?"":row[map._alt[k][i]]).trim();
      return v;
    }
    var first = titleCase(g("first")), last = titleCase(g("last"));
    if ((!first || !last) && g("full")){ var sp = splitName(g("full")); first = first || sp.first; last = last || sp.last; }
    var company = cap(titleCase(g("company")),120);
    if (!first && !last && !company) return {skip:"noname"};
    var lines = cap(g("lines"),200);
    if (opt.lifeOnly && map.lines && !/life/i.test(lines)) return {skip:"notlife"};
    var exp = parseDate(g("exp"));
    if (opt.skipExpired && exp && exp < todayIso) return {skip:"expired"};
    var lic = parseDate(g("lic"));
    if (opt.sinceIso && (!lic || lic < opt.sinceIso)) return {skip:"old"};
    var title = cap(g("title"),120), sen = g("seniority");
    var kw = cap(g("keywords"),300);
    if (sen) kw = cap((kw ? kw+"; " : "")+"seniority: "+sen, 300);
    return {rec:{
      id:uid(), first:cap(first,60), last:cap(last,60),
      email:normEmail(g("email")), phone:normPhone(g("phone")), mobile:normPhone(g("mobile")),
      company:company, title:title, kind:(!first && !last) ? "agency" : "",
      city:cap(titleCase(g("city")),60), state:normState(g("state")), zip:cap(g("zip"),10),
      lic:lic||"", npn:cap(g("npn").replace(/\.0$/,""),15), lines:lines,
      linkedin:cap(g("linkedin"),200), keywords:kw,
      notes:"", source:cap(opt.source||"Import",60), status:"new", tier:"", sms:null, exported:"", added:todayIso
    }};
  }

  function keyName(r){ return (r.first && r.last) ? (r.first+"|"+r.last+"|"+(r.state||"")).toLowerCase() : ("co|"+(r.company||"")+"|"+(r.state||"")).toLowerCase(); }
  function makeIndex(list){
    var ix = {npn:{}, email:{}, name:{}};
    list.forEach(function(r){ indexOne(ix, r); });
    return ix;
  }
  function indexOne(ix, r){
    if (r.npn) ix.npn[r.npn] = r;
    if (r.email) ix.email[r.email] = r;
    if ((r.first && r.last) || r.company) ix.name[keyName(r)] = r;
  }
  function findMatch(ix, r){
    if (r.npn && ix.npn[r.npn]) return ix.npn[r.npn];
    if (r.email && ix.email[r.email]) return ix.email[r.email];
    if (((r.first && r.last) || (r.kind==="agency" && r.company)) && r.state && ix.name[keyName(r)]) return ix.name[keyName(r)];
    return null;
  }
  var FILL = ["email","phone","mobile","company","title","city","state","zip","npn","linkedin"];
  function mergeInto(a, b){
    FILL.forEach(function(f){ if (!a[f] && b[f]) a[f] = b[f]; });
    if (b.lic && (!a.lic || b.lic < a.lic)) a.lic = b.lic;
    if (b.lines && (a.lines||"").indexOf(b.lines)<0) a.lines = cap(a.lines ? a.lines+" | "+b.lines : b.lines, 200);
    if (b.keywords && (a.keywords||"").indexOf(b.keywords)<0) a.keywords = cap(a.keywords ? a.keywords+"; "+b.keywords : b.keywords, 300);
    if (b.source && (a.source||"").indexOf(b.source)<0) a.source = cap(a.source ? a.source+", "+b.source : b.source, 60);
    return a;
  }

  var LEADER_RX = /\b(owner|co-owner|principal|president|founder|ceo|partner|managing director|agency manager|general agent|managing general agent|mga|bga|imo|fmo|field marketing|regional (vice president|director|manager|leader)|rvp|svp|evp|vice president|vp|director|agency builder|district manager|sales manager|c_suite)\b/i;
  var TOP_RX = /\b(mdrt|million dollar round table|court of the table|top of the table|cot|tot|chairman'?s (council|club|circle)|president'?s (club|council|circle)|leaders'? (club|conference))\b/i;

  /* NPN -> approximate first-licensed date. NPNs are issued in order, so the number dates a career.
     Anchors: median NPN of Texas residents first licensed in that month (Texas Dept. of Insurance open data, pulled Nov 2026). */
  var NPN_ANCHORS = [[3386751,"2000-04-15"],[8043636,"2004-04-15"],[10634933,"2008-04-15"],[16608746,"2012-04-15"],[17907943,"2016-04-15"],[19096903,"2019-04-15"],[19865869,"2021-04-15"],[20298398,"2022-04-15"],[20679150,"2023-04-15"],[21137941,"2024-04-15"],[21354234,"2024-10-15"],[21556750,"2025-04-15"],[21756288,"2025-10-15"],[22189477,"2026-04-15"],[22385170,"2026-10-15"]];
  function isoFromMs(ms){ var d = new Date(ms); return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate()); }
  function npnStart(npn){
    var n = parseInt(String(npn||"").replace(/\D/g,""),10);
    if (!n || n < 1000) return null;
    var A = NPN_ANCHORS;
    if (n < A[0][0]) return "1999-01-01";
    for (var i=1;i<A.length;i++){
      if (n <= A[i][0]){
        var a = A[i-1], b = A[i], f = (n-a[0])/(b[0]-a[0]);
        return isoFromMs(dateMs(a[1]) + f*(dateMs(b[1])-dateMs(a[1])));
      }
    }
    var l = A[A.length-1], k = A[A.length-2], rate = (dateMs(l[1])-dateMs(k[1]))/(l[0]-k[0]);
    return isoFromMs(dateMs(l[1]) + (n-l[0])*rate);
  }
  function npnAt(iso){
    var A = NPN_ANCHORS, t = dateMs(iso);
    if (t <= dateMs(A[0][1])) return A[0][0];
    for (var i=1;i<A.length;i++){
      var tb = dateMs(A[i][1]);
      if (t <= tb){ var ta = dateMs(A[i-1][1]), f = (t-ta)/(tb-ta); return Math.round(A[i-1][0] + f*(A[i][0]-A[i-1][0])); }
    }
    var l = A[A.length-1], k = A[A.length-2];
    return Math.round(l[0] + (t-dateMs(l[1]))*(l[0]-k[0])/(dateMs(l[1])-dateMs(k[1])));
  }
  function derive(p, nowMs){
    var days = null, yrs = null, start = p.lic || null, est = false;
    if (p.kind!=="agency"){
      var ns = npnStart(p.npn);
      if (ns && (!start || ns < start)) { start = ns; est = true; }
    }
    var lt = dateMs(start);
    if (!isNaN(lt)) { days = Math.max(0, Math.floor((nowMs - lt)/864e5)); yrs = days/365.25; }
    var leader = p.kind==="agency" || LEADER_RX.test((p.title||"")+" "+(p.keywords||"").replace(/.*seniority:/i,""));
    var topText = TOP_RX.test((p.title||"")+" "+(p.keywords||"")+" "+(p.notes||""));
    var top = p.tier==="top" ? true : (p.tier==="no" ? false : topText);
    var seg;
    if (days!=null) seg = days<=365 ? "new" : yrs<5 ? "building" : yrs<10 ? "established" : "veteran";
    else if (/\b(trainee|new agent|newly licensed|apprentice|agent in training)\b/i.test((p.title||"")+" "+(p.keywords||""))) seg = "new";
    else seg = "unknown";
    var track = (leader || top || seg==="veteran") ? "leader" : seg==="new" ? "rookie" : "experienced";
    var s = 0, why = [];
    function add(n, t){ s += n; why.push((n>0?"+":"")+n+" "+t); }
    if (p.email) add(20,"has an email address");
    if (p.phone || p.mobile) add(15,"has a phone number");
    if (p.lines) { if (/life/i.test(p.lines)) add(10,"holds a life license"); }
    else add(5,"lines of authority unknown");
    if (top) add(25,"top-producer signal (MDRT, COT, TOT or marked by you)");
    if (p.kind==="agency") add(20,"licensed life agency (an agency owner to recruit)");
    else if (leader) add(20,"agency owner or leader title");
    if (seg==="new") { if (days!=null && days<=90) add(25,"licensed in the last 90 days, likely still choosing an upline"); else add(12,"licensed within the last year"); }
    if (seg==="veteran") add(10,"licensed 10+ years");
    if (seg==="established") add(6,"licensed 5–9 years");
    if (seg==="building" && yrs>=2) add(8,"licensed 2+ years, past the rookie stage");
    if (p.sms) add(5,"opted in to texts");

  }

  /* Batches Claude drops into the store ("in_*" documents): pipe-separated rows */
  function parseIncoming(doc, todayIso){
    var out = [], kind = doc.kind, src = cap(doc.source||"Claude import",60);
    if (Array.isArray(doc.records)) return doc.records.map(function(r){ return Object.assign(blank(src,todayIso), r); });
    String(doc.rows||"").split("\n").forEach(function(line){
      var f = line.split("|"); if (f.length<4) return;
      var r = blank(src, todayIso);
      if (kind==="agency"){
        r.npn = f[0]; r.company = cap(titleCase(f[1]),120); r.lic = parseDate(f[2])||""; r.city = titleCase(f[3]); r.state = normState(f[4]); r.zip = f[5]||"";
        r.first = titleCase(f[6]||""); r.last = titleCase(f[7]||""); r.kind = "agency"; r.lines = "Life Agency"; r.title = "Agency owner";
      } else {
        var nm = splitName(f[1]); r.npn = f[0]; r.first = nm.first; r.last = nm.last;
        r.lines = f[2]==="L" ? "Life Agent" : "Life, Accident, Health & HMO";
        r.lic = parseDate(f[3])||""; r.city = titleCase(f[4]); r.state = normState(f[5]); r.zip = f[6]||"";
      }

    });
    return out;
  }

  function csvCell(v){ v = v==null ? "" : String(v); return /[",\n\r]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
  function slug(s){ return String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,30); }
  var GHL_HEAD = ["First Name","Last Name","Email","Phone","Company Name","City","State","Postal Code","Source","Tags","NPN","Years Licensed","License Issue Date","Recruit Track","Recruit Score","Top Producer","SMS Consent","SMS Consent Date","SMS Consent Method","LinkedIn URL","Notes","Recruit Email 1 Subject","Recruit Email 1 Body","Recruit Email 2 Subject","Recruit Email 2 Body","Recruit Email 3 Subject","Recruit Email 3 Body"];
  var TRACK_LABEL = {rookie:"New agent", experienced:"Experienced", leader:"Veteran / leader"};
  function ghlRow(p, d, emails){
    var tags = ["recruit","track-"+d.track];
    if (d.seg!=="unknown") tags.push("seg-"+d.seg);
    if (d.hot) tags.push("hot-new-licensee");
    if (d.top) tags.push("top-producer");
    if (d.leader) tags.push("agency-leader");
    if (p.state) tags.push("state-"+p.state.toLowerCase());

      p.sms ? "Yes" : "No", p.sms ? p.sms.at : "", p.sms ? p.sms.how : "", p.linkedin, cap(p.notes,500)].concat(emails || ["","","","","",""]);
  }
  /* emailsFor(p, d) -> [s1,b1,s2,b2,s3,b3], already personalized (supplied by the page) */
  function toGhlCsv(list, nowMs, emailsFor){

    list.forEach(function(p){ var d = derive(p, nowMs); out.push(ghlRow(p, d, emailsFor ? emailsFor(p, d) : null).map(csvCell).join(",")); });

  /* minimal CSV parser (fallback when Papa Parse is unavailable) */
  function parseCsv(text){
    var rows = [], row = [], f = "", q = false, i = 0, c, delim = ",";
    var firstLine = text.slice(0, text.indexOf("\n")>-1 ? text.indexOf("\n") : text.length);

    if (text.charCodeAt(0)===0xFEFF) i = 1;
    for (; i<text.length; i++){
      c = text[i];
      if (q){ if (c==='"'){ if (text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
      else if (c==='"') q = true;
      else if (c===delim){ row.push(f); f=""; }
      else if (c==="\n"){ row.push(f); rows.push(row); row=[]; f=""; }
      else if (c!=="\r") f += c;
    }
    if (f!=="" || row.length){ row.push(f); rows.push(row); }
    rows = rows.filter(function(r){ return r.length>1 || (r[0]||"").trim()!==""; });
    var head = (rows.shift()||[]).map(function(h){ return h.trim(); });
    return {fields:head, data:rows.map(function(r){ var o={}; head.forEach(function(h,k){ o[h] = r[k]==null?"":r[k]; }); return o; })};
  }

  var STATUSES = [
    {k:"new",label:"Not contacted",color:"var(--line-2)"},
    {k:"contacted",label:"Contacted",color:"#8aa2e8"},
    {k:"replied",label:"Replied",color:"var(--accent)"},
    {k:"booked",label:"Call booked",color:"var(--exp)"},
    {k:"contracting",label:"Contracting",color:"var(--lead)"},
    {k:"joined",label:"Joined",color:"var(--good)"},
    {k:"notnow",label:"Not now",color:"var(--warn)"},
    {k:"dnc",label:"Do not contact",color:"var(--bad)"}
  ];

  return {STATES:STATES, TARGETS:TARGETS, autoMap:autoMap, parseDate:parseDate, dateMs:dateMs, splitName:splitName,
    titleCase:titleCase, normPhone:normPhone, fmtPhone:fmtPhone, normState:normState, buildRecord:buildRecord,

})();
if (typeof module !== "undefined") module.exports = Core;

  function filtered(){
    var f = S.f, q = f.q.trim().toLowerCase();
    var out = S.list.filter(function(p){
      var d = D(p);
      if (f.track && d.track !== f.track) return false;
      if (f.status && p.status !== f.status) return false;
      if (f.state && p.state !== f.state) return false;
      if (f.owner==="none" && p.assigned) return false;
      if (f.owner && f.owner!=="none" && p.assigned !== f.owner) return false;
      if (f.contact==="email" && !p.email) return false;
      if (f.contact==="phone" && !(p.phone||p.mobile)) return false;
      if (f.contact==="none" && (p.email||p.phone||p.mobile)) return false;
      if (f.contact==="apollo" && !p.ap) return false;
      if (f.flag==="hot" && !d.hot) return false;
      if (f.flag==="top" && !d.top) return false;
      if (f.flag==="due" && !(p.fu && p.fu <= TODAY && p.status!=="dnc")) return false;
      if (f.flag==="waiting" && !p.waiting) return false;
      if (q){ var hay = (p.first+" "+p.last+" "+p.company+" "+p.city+" "+p.state+" "+p.email+" "+p.npn+" "+p.title).toLowerCase(); if (hay.indexOf(q)<0) return false; }
      return true;
    });
    var k = S.sort.k, dir = S.sort.dir, order = {}; C.STATUSES.forEach(function(s,i){ order[s.k]=i; });
    out.sort(function(a,b){
      var x, y;
      if (k==="score"){ x = D(a).score; y = D(b).score; }
      else if (k==="name"){ x = ((a.last||a.company)+" "+a.first).toLowerCase(); y = ((b.last||b.company)+" "+b.first).toLowerCase(); }
      else if (k==="yrs"){ x = D(a).days==null ? (dir>0?1e9:-1) : D(a).days; y = D(b).days==null ? (dir>0?1e9:-1) : D(b).days; }
      else if (k==="state"){ x = a.state||"~"; y = b.state||"~"; }
      else if (k==="status"){ x = order[a.status]; y = order[b.status]; }
      else if (k==="touch"){ x = a.lastTouch ? a.lastTouch.at : ""; y = b.lastTouch ? b.lastTouch.at : ""; }

  /* ================= SCRIPTS ================= */
  var scrTrack = "rookie";
  function ensureEditable(){
    if (!S.scripts) S.scripts = {tracks:{}, objections:null};
    if (!S.scripts.tracks) S.scripts.tracks = {};
    if (!Array.isArray(S.scripts.tracks[scrTrack])) S.scripts.tracks[scrTrack] = SCRIPTS[scrTrack].items.map(function(x){ return Object.assign({}, x); });
  }
  function vScripts(){
    var wrap = h("section",{class:"view"});
    var seg = h("div",{class:"seg"});
    ["rookie","experienced","leader"].forEach(function(k){ seg.appendChild(h("button",{type:"button","aria-pressed":scrTrack===k?"true":"false",onclick:function(){ scrTrack = k; renderView(true); }}, SCRIPTS[k].label)); });
    wrap.appendChild(h("div",{style:"display:flex;gap:14px;align-items:center;flex-wrap:wrap"}, seg, h("span",{class:"note",style:"flex:1;min-width:220px"}, SCRIPTS[scrTrack].who)));
    wrap.appendChild(h("div",{class:"note"},"Changes save as you type. Tags fill in per agent: {first} {stateName} {years} {company} · yours: {myName} {myPhone} {agency}. Your details live under Import & settings."));
    var list = h("div",{class:"stagger",style:"display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px"});
    var items = getTpls(scrTrack);
    items.forEach(function(t, i){
      var name = h("input",{class:"field",value:t.name||"","aria-label":"Template name"});
      var sub = t.ch==="Email" ? h("input",{class:"field",value:t.subject||"","aria-label":"Subject"}) : null;
      var ta = h("textarea",{class:"field",rows:"9","aria-label":"Message"}); ta.value = t.body||"";
      if (!isOwner()){ name.readOnly = true; if (sub) sub.readOnly = true; ta.readOnly = true; }
      function upd(){ if (!isOwner()) return; ensureEditable(); var x = S.scripts.tracks[scrTrack][i]; x.name = name.value; if (sub) x.subject = sub.value; x.body = ta.value; saveScripts(); }
      [name, sub, ta].forEach(function(el){ if (el) el.addEventListener("input", upd); });
      list.appendChild(h("div",{class:"tpl",style:"animation-delay:"+(i*50)+"ms"}, h("div",{class:"r"}, h("span",{class:"chip ap"}, t.ch), name), sub, ta));
    });
    wrap.appendChild(list);
    if (!isOwner()) wrap.appendChild(h("div",{class:"note"},"Frank sets the team's scripts. You can still change any message before you send it."));
    else wrap.appendChild(h("div",null, h("button",{type:"button",class:"btn sm",onclick:function(){ ask("Reset these scripts?","Puts the "+SCRIPTS[scrTrack].label+" scripts back to the defaults. Your edits to this segment are lost.","Reset", function(){ if (S.scripts && S.scripts.tracks) delete S.scripts.tracks[scrTrack]; saveScripts(); renderView(true); toast("Scripts reset"); }); }},"Reset to defaults")));
    var obj = h("div",{class:"card"}, h("div",{class:"hd"}, h("h2",null,"Objection handling")), h("div",{class:"bd",style:"display:flex;flex-direction:column;gap:12px"}));
    OBJECTIONS.forEach(function(o){ obj.lastChild.appendChild(h("div",null, h("b",null,o.q), h("div",{class:"note",style:"color:var(--ink-2)"}, o.a))); });
    wrap.appendChild(obj);
    return wrap;
  }

  /* ================= SETTINGS / IMPORT ================= */
  function vSettings(){
    var wrap = h("section",{class:"view"}), s = S.settings;
    var g = h("div",{class:"cols2"});
    [["myName","Name you sign emails with","Frank B."],["myPhone","Your phone","(248) 805-2855"]].concat(isOwner() ? [["agency","Agency (everyone)","ClearPoint Global"]] : []).concat([["calendar","Calendar link (optional)","https://calendly.com/…"],["optin","Text opt-in page (optional)",""]]).forEach(function(f){
      var id = "s_"+f[0], inp = h("input",{class:"field",id:id,value:s[f[0]]||"",placeholder:f[2]});
      inp.addEventListener("input", function(){ s[f[0]] = inp.value.trim(); saveSettings(); });
      g.appendChild(h("label",{class:"lbl",for:id}, f[1], inp));
    });
    wrap.appendChild(h("div",{class:"card"}, h("div",{class:"hd"}, h("h2",null,"Your details")), h("div",{class:"bd",style:"display:flex;flex-direction:column;gap:10px"}, g, h("div",{class:"note"},"Signed in as "+(S.me?S.me.email:"")+". These fill {myName}, {myPhone} and {agency} in your scripts. Each teammate signs with their own name and number."))));

    var drop = h("div",{class:"drop"}, h("b",{style:"font-size:16px"},"Drop CSV files here"), h("span",{class:"note"},"Your state lists from Google Sheets (File → Download → CSV), Apollo exports, or state license files. Duplicates merge by NPN, email or name."),
      h("button",{type:"button",class:"btn primary",disabled:!Store.ready && !S.examples ? true : false,onclick:function(){ $("#fileIn").click(); }},"Choose files"), h("div",{class:"note",id:"impProg"}));
    ["dragenter","dragover"].forEach(function(ev){ drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.add("over"); }); });
    ["dragleave","drop"].forEach(function(ev){ drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.remove("over"); }); });
    drop.addEventListener("drop", function(e){ importFiles(e.dataTransfer.files); });
    if (isLead()) wrap.appendChild(h("div",{class:"card"}, h("div",{class:"hd"}, h("h2",null,"Import agents"), h("span",{class:"note"}, nf(S.examples?0:S.list.length)+" agents in the CRM")), h("div",{class:"bd"}, drop)));

    wrap.appendChild(h("div",{class:"card"}, h("div",{class:"hd"}, h("h2",null,"Download")), h("div",{class:"bd",style:"display:flex;gap:10px;flex-wrap:wrap;align-items:center"},
      h("button",{type:"button",class:"btn",onclick:function(){ exportCsv(filtered()); }},"Download agents matching current filters"),
      h("button",{type:"button",class:"btn",onclick:function(){ exportCsv(S.list); }},"Download everyone"),
      isOwner() ? h("a",{class:"btn",href:"https://docs.google.com/spreadsheets/d/1P5lpG1UJpD47VnOm9VZTp5mWh6j1OVXC_HsjFK_zqCA/edit",target:"_blank",rel:"noopener"},"Open campaign sheet") : null)));
    return wrap;
  }
  $("#fileIn").addEventListener("change", function(){ importFiles(this.files); this.value = ""; });
  function importFiles(files){
    files = Array.prototype.slice.call(files||[]); if (!files.length) return;
    if (!Store.ready){ toast("Still connecting to the database. Try again in a moment."); return; }
    if (!isLead()){ toast("Only Frank and managers can import agents."); return; }
    if (S.examples){ S.list = []; S.examples = false; $("#exBanner").hidden = true; }
    var ix = C.makeIndex(S.list), tot = {added:0, merged:0, skipped:0, rows:0}, today = todayIso();
    (function next(){
      var f = files.shift();
      if (!f){ toast("Imported: "+nf(tot.added)+" new, "+nf(tot.merged)+" merged"+(tot.skipped?", "+nf(tot.skipped)+" skipped":"")); renderView(true); refreshBadges(); return; }
      var map = null, src = f.name.replace(/\.[a-z]+$/i,"").slice(0,60);
      function row(r){
        tot.rows++;
        if (!map) map = C.autoMap(Object.keys(r));
        var cs = String(r["Status"]||"").trim();
        if (/^Not used/i.test(cs)){ tot.skipped++; return; }
        var b = C.buildRecord(r, map, {source:src}, today);
        if (!b.rec){ tot.skipped++; return; }
        var rec = b.rec;
        var team = parseInt(r["Agents At Same Agency"],10);
        if (/^A/.test(r["Priority"]||"") && team>1 && !rec.keywords) rec.keywords = "agency team: "+team+" licensed agents share this email domain";
        if (/In sequence|Skipped|Finished/i.test(cs)){ var at = C.parseDate(r["Last Sent"]); at = at ? new Date(at+"T15:00:00Z").toISOString() : new Date().toISOString(); rec.status = "contacted"; rec.lastTouch = {at:at, ch:"email", dir:"out", what:"Campaign email "+(r["Step"]||1)+" sent"}; }
        else if (/Replied/i.test(cs)){ rec.status = "replied"; rec.waiting = true; rec.lastTouch = {at:new Date().toISOString(), ch:"email", dir:"in", what:"Replied to your campaign email", body:"Check Gmail for their reply."}; }
        else if (/Bounced/i.test(cs)) rec.notes = "Campaign email bounced. Email address may be bad.";
        var m = C.findMatch(ix, rec);
        if (m){ C.mergeInto(m, rec); if (m.status==="new" && rec.status!=="new"){ m.status = rec.status; m.lastTouch = rec.lastTouch; m.waiting = rec.waiting; } if (!m.keywords && rec.keywords) m.keywords = rec.keywords; touch(m); markDirty(m); tot.merged++; return; }
        if (S.list.length >= MAX){ tot.skipped++; return; }
        norm(rec); rec._new = true; S.list.push(rec); C.indexOne(ix, rec); markDirty(rec); tot.added++;
      }
      var pr = $("#impProg");
      if (window.Papa){
        Papa.parse(f, {header:true, skipEmptyLines:true, chunkSize:1024*512, chunk:function(res){ res.data.forEach(row); if (pr) pr.textContent = "Reading "+f.name+": "+nf(tot.rows)+" rows…"; }, complete:next, error:function(){ toast("Couldn't read "+f.name); next(); }});
      } else { f.text().then(function(t){ C.parseCsv(t).data.forEach(row); next(); }); }
    })();
  }
  function csvCell(v){ v = v==null ? "" : String(v); return /[",\n\r]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
  async function exportCsv(list){
    list = list.filter(Boolean);
    if (!list.length){ toast("No agents to download."); return; }
    var head = ["First Name","Last Name","Email","Mobile","Business Phone","Agency","Title","City","State","NPN","Years Licensed","Segment","Stage","Score","Follow Up","LinkedIn","Apollo Title","Apollo Email Status","Notes"];
    var out = [head.join(",")];
    list.forEach(function(p){ var d = D(p); out.push([p.first,p.last,p.email,C.fmtPhone(p.mobile),C.fmtPhone(p.phone),p.company,p.title,p.city,p.state,p.npn,d.yrs==null?"":Math.floor(d.yrs),C.TRACK_LABEL[d.track],(STATUS[p.status]||{}).label,d.score,p.fu||"",p.linkedin,p.ap?p.ap.title:"",p.ap?p.ap.es:"",p.notes].map(csvCell).join(",")); });
    var name = "agents-"+todayIso()+".csv", dl = null;
    try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch(e){}
    if (!dl){ var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([out.join("\r\n")],{type:"text/csv"})); a.download = name; document.body.appendChild(a); a.click(); a.remove(); toast("Downloading "+nf(list.length)+" agents"); return; }
    try { await dl.save({filename:name, data:out.join("\r\n")}); toast("Downloading "+nf(list.length)+" agents"); } catch(e){ toast("Download cancelled."); }
  }

  /* ================= add agent ================= */
  $("#addBtn").addEventListener("click", function(){
