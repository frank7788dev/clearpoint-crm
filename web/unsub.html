<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Email preferences · ClearPoint Global</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font:16px/1.55 "Hanken Grotesk",system-ui,sans-serif;color:#0b0b0c;background:#f7f7f5}
.top{background:#060607;padding:30px 20px 60px;text-align:center}
.top img{width:min(280px,70vw);height:auto}
.card{max-width:480px;margin:-34px auto 40px;background:#fff;border:1px solid #e4e4df;border-top:2px solid #c8a45c;border-radius:10px;padding:28px 26px;text-align:center}
h1{font:500 21px/1.3 Cinzel,serif;letter-spacing:.04em;margin:0 0 10px}
p{margin:0 0 18px;color:#3f4147}
button{all:unset;cursor:pointer;background:#0b0b0c;color:#fff;font-weight:600;padding:12px 22px;border-radius:7px;box-shadow:inset 0 -2px 0 #c8a45c}
button[disabled]{opacity:.5;pointer-events:none}
button:focus-visible{outline:2px solid #c8a45c;outline-offset:2px}
small{display:block;margin-top:18px;color:#7a7c83;font-size:13px}
</style>
</head>
<body>
<div class="top"><img src="brand/cpg-lockup.png" alt="ClearPoint Global"></div>
<div class="card" id="card"><h1>One moment</h1><p>Loading your email preferences.</p></div>
<script src="config.js"></script>
<script>
(function(){
  var CFG = window.CRM_CONFIG || {}, a = new URLSearchParams(location.search).get("a") || "", card = document.getElementById("card");
  function show(title, text, btn){ card.textContent = ""; var h = document.createElement("h1"); h.textContent = title; var p = document.createElement("p"); p.textContent = text; card.appendChild(h); card.appendChild(p); if (btn) card.appendChild(btn); var s = document.createElement("small"); s.textContent = "ClearPoint Global · Frank B. · (248) 805-2855"; card.appendChild(s); }
  async function call(confirm){
    var r = await fetch(CFG.url + "/functions/v1/campaign-sync", {method:"POST", headers:{"Content-Type":"application/json", "Authorization":"Bearer "+CFG.key, "apikey":CFG.key}, body:JSON.stringify({event:"unsub", a:a, confirm:!!confirm})});
    var j = {}; try { j = await r.json(); } catch(e){}
    if (!r.ok) throw new Error(j.error || "Something went wrong. Reply to the email with “remove me” and we'll take care of it.");
    return j;
  }
  function done(first){ show("You're off the list", (first ? first + ", you" : "You") + " won't get any more emails from ClearPoint Global. Sorry for the interruption."); }
  call(false).then(function(j){
    if (j.done){ done(j.first); return; }
    var b = document.createElement("button"); b.type = "button"; b.textContent = "Stop emailing me";
    b.addEventListener("click", function(){ b.disabled = true; b.textContent = "Removing you…"; call(true).then(function(){ done(j.first); }).catch(function(e){ show("That didn't go through", e.message); }); });
    show("Stop emails from ClearPoint Global?", (j.first ? j.first + ", press" : "Press") + " the button and you won't hear from us again.", b);
  }).catch(function(e){ show("This link didn't work", e.message); });
})();
</script>
</body>
</html>
